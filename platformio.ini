[platformio]
default_envs = T-Echo
boards_dir = boards

[env]
platform = nordicnrf52
framework = arduino
monitor_speed = 115200

build_flags =
  -Wno-misleading-indentation
  -DWITH_NRF52             ; nRF52xxx CPU
  -DWITH_CONFIG            ; allow $POGNS config commands
  -DWITH_LOOKOUT           ; anti-collision algorithm
  -DWITH_PFLAA             ; send PFLAA/U over BLE
  -DWITH_BLE_SPP           ; BLE serial port for XCSoar and SkyDemon
  -DWITH_GPS_CONFIG        ;
  -DWITH_GPS_PCAS          ; GPS understands PCAS commands
  -DWITH_GPS_PPS           ; PPS is wired
  -DWITH_OGN               ; With 868MHz radio
  -DWITH_LBT
  -DWITH_ADSL              ;
  -DWITH_FANET             ;
  -DWITH_MESHT             ;
  -DWITH_LORAWAN           ; LoRaWAN support (works with TTN)
  -DWITH_SX1262            ; Radio chip
  -DWITH_LOG               ; log flight to external flash (but first format the flash with double Ctrl-O)
  -DRADIOLIB_GODMODE       ; advanced functions are needed from the RadioLib
  -DUSE_TINYUSB
  -DUSBCON
  -DCFG_TUD_CDC_RX_BUFSIZE=256 ; more buffering for the USB console
  -DCFG_TUD_CDC_TX_BUFSIZE=512
  -DSERIAL_BUFFER_SIZE=512

lib_deps =
  SPI
  Wire
  RadioLib
  adafruit/Adafruit SPIFlash
  adafruit/SdFat - Adafruit Fork
  https://github.com/LennartHennigs/Button2

extra_scripts =
  post:scripts/build_uf2.py

[env:T-Echo]
board = t_echo
board_build.variants_dir = variants
custom_uf2_base = 0x26000
build_flags =
  ${env.build_flags}
  -DWITH_T_ECHO
  -DWITH_EPAPER
  -DWITH_INTERNAL_FS
  -DHARD_NAME=\"TEcho\"

lib_deps =
  ${env.lib_deps}
  zinggjm/GxEPD2 @ ^1.5.0

; The T-Echo is normally updated by copying the generated UF2 file
; from .pio/build/T-Echo/firmware.uf2 to the bootloader USB drive.

[env:Wio-Tracker]
board = seeed_wio_tracker_l1
board_build.variants_dir = variants
board_build.ldscript = ldscripts/nrf52840_s140_v7.ld
custom_uf2_base = 0x27000
build_flags =
  ${env.build_flags}
  -DWITH_WIO_TRACKER
  -DWITH_OLED
  -DWITH_OLED_MENU
  -DWITH_BIGOLED
  -DWITH_OLED_DIM=5     ; [min] OLED dim timeout
  -DWITH_BEEPER
;  -DCONS_OUTPUT
  -DWITH_INTERNAL_FS   ; store parameters in internal flash rather than external
  -DHARD_NAME=\"WTL1\"

lib_deps =
  ${env.lib_deps}
  u8g2

; Wio Tracker L1 ships with SoftDevice S140 7.3.0. Its application region
; starts at 0x27000; using the T-Echo/S140 v6 address (0x26000) will not boot.

[env:Wio-Xiao]
board = seeed_xiao_wio_sx1262
board_build.variants_dir = variants
board_build.ldscript = ldscripts/nrf52840_s140_v7.ld
custom_uf2_base = 0x27000
build_flags =
  ${env.build_flags}
  -DWITH_WIO_XIAO
  -DHARD_NAME=\"WXiao\"

; Seeed's Adafruit-core XIAO nRF52840 board definition uses SoftDevice S140
; 7.3.0, so the application starts at 0x27000, not the older 0x26000 base.
