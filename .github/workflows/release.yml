name: Firmware release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Set and validate firmware version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "OGN_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build T-Echo firmware
        run: pio run -e T-Echo

      - name: Build Wio-Tracker firmware
        run: pio run -e Wio-Tracker

      - name: Package release images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          for env in T-Echo Wio-Tracker; do
            image=".pio/build/${env}/firmware.uf2"
            test -f "$image"
            cp "$image" "release/nrf52-ogn-tracker-${env}-${GITHUB_REF_NAME}.uf2"
          done

          sha256sum release/*.uf2 > release/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "nrf52-ogn-tracker $GITHUB_REF_NAME" \
            --generate-notes
